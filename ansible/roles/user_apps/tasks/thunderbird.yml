---
- name: 下载并解压 Thunderbird 官方原生版 (规避 Ubuntu Snap 依赖)
  unarchive:
    src: "https://download.mozilla.org/?product=thunderbird-latest-SSL&os=linux64&lang={{ thunderbird_lang | default('zh-CN') }}"
    dest: "{{ programs_dir }}/"
    remote_src: true
    creates: "{{ programs_dir }}/thunderbird/thunderbird"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"

- name: 拷贝自定义 Thunderbird 图标
  copy:
    src: thunderbird.png
    dest: "{{ programs_dir }}/thunderbird/thunderbird.png"
    mode: "0644"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"

- name: 创建 Thunderbird 桌面快捷方式 (当前用户)
  template:
    src: thunderbird.desktop.j2
    dest: "{{ user_applications_dir }}/thunderbird.desktop"
    mode: "0755"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"

- name: 确保当前用户开机自启目录存在
  file:
    path: "/home/{{ admin_user }}/.config/autostart"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"

- name: 设置 Thunderbird 开机自动启动 (当前用户)
  file:
    src: "{{ user_applications_dir }}/thunderbird.desktop"
    dest: "/home/{{ admin_user }}/.config/autostart/thunderbird.desktop"
    state: link
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"