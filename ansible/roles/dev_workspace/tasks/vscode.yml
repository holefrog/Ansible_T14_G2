---
- name: 确保 apt keyrings 目录存在
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: 下载微软 VSCode GPG 密钥
  get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/packages.microsoft.asc
    mode: '0644'

- name: 移除可能冲突的旧版 list 配置
  file:
    path: /etc/apt/sources.list.d/vscode.list
    state: absent

- name: 添加 VSCode APT 仓库
  deb822_repository:
    name: vscode
    types: deb
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/packages.microsoft.asc

- name: 安装 VSCode 及依赖
  apt:
    name: 
      - apt-transport-https
      - code
    state: present
    update_cache: yes