---
- name: 安装 Docker 及其依赖组件
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: 确保 Docker 服务已启动并设置开机自启
  systemd:
    name: docker
    state: started
    enabled: true

- name: 将当前管理员用户加入 docker 组 (免 sudo 执行 docker)
  user:
    name: "{{ admin_user }}"
    groups: docker
    append: true
